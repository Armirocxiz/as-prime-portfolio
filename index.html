<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS PRIME | Selected Work</title><meta name="description" content="AS Prime creative production portfolio"><style>:root{color-scheme:dark;--lime:#baff22}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#080b08;color:#f5f5ef;font:16px Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:22px 5%;border-bottom:1px solid #303a25;background:#080b08e8;position:sticky;top:0;z-index:2}.logo{font-size:24px;font-weight:900;letter-spacing:.12em}a{color:inherit;text-decoration:none}nav a{margin-left:20px;font-size:13px}nav a:hover{color:var(--lime)}.hero{padding:105px 5% 90px;background:radial-gradient(ellipse at 78% 35%,#2a4b1c 0,transparent 46%),#090c09}.eyebrow{font-size:12px;letter-spacing:.25em;color:var(--lime);text-transform:uppercase}h1{font-size:clamp(55px,9vw,125px);line-height:.91;letter-spacing:-.07em;margin:22px 0}h1 span{color:var(--lime)}p{color:#bfc4ba;line-height:1.7;max-width:590px}.button{display:inline-block;margin-top:20px;background:var(--lime);padding:15px 22px;color:#0b1008;font-weight:800}main{padding:55px 5%}h2{font-size:clamp(28px,4vw,45px);letter-spacing:-.04em}.section{margin:45px 0}.section h3{font-size:21px}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,30%);overflow-x:auto;gap:16px;padding-bottom:15px;scroll-snap-type:x mandatory}.tile{cursor:pointer;scroll-snap-align:start}.poster{aspect-ratio:16/9;position:relative;background:linear-gradient(130deg,#294021,#101811);border:1px solid #3b4a31;display:flex;align-items:center;justify-content:center;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.play{position:absolute;background:var(--lime);color:#080b08;border-radius:50%;width:55px;height:55px;display:grid;place-items:center;font-size:24px}.tile h4{margin:12px 0 5px}.tile small{color:#a6ad9f}.pending{color:#adbba1;font-size:12px;letter-spacing:.1em}.tag{color:var(--lime);font-size:12px}footer{border-top:1px solid #263120;padding:30px 5%;color:#9ba494}dialog{background:#11170f;color:white;border:1px solid #4b6335;width:min(920px,95vw);padding:0}dialog::backdrop{background:#000d}.modalbar{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}button{cursor:pointer}.close{border:0;background:transparent;color:white;font-size:28px}.player{aspect-ratio:16/9}.player iframe{width:100%;height:100%;border:0}.details{padding:18px;color:#b4c0ab}@media(max-width:650px){.rail{grid-auto-columns:80%}.hero{padding-top:70px}nav a{margin-left:10px}}</style></head><body><header><a class="logo" href="#">AS PRIME</a><nav><a href="#work">OUR WORK</a><a href="https://wa.me/971501134339">CONTACT</a></nav></header><section class="hero"><div class="eyebrow">AS Prime / Selected Productions</div><h1>WORK THAT<br><span>SPEAKS.</span></h1><p>Film, content and brand experiences. Explore our selected production work.</p><a class="button" href="#work">EXPLORE OUR WORK ↘</a></section><main id="work"><div class="eyebrow">The collection</div><h2>SELECTED WORK<span style="color:var(--lime)">.</span></h2><div id="catalog"></div></main><footer>AS PRIME · CREATIVE PRODUCTION · <a href="https://as-prime.com">AS-PRIME.COM</a> · +971 50 113 4339</footer><dialog id="modal"><div class="modalbar"><strong id="title"></strong><button class="close" onclick="closePlayer()" aria-label="Close">×</button></div><div id="player" class="player"></div><div class="details" id="details"></div></dialog><script>
const projects=[{title:"NRL — AI Explainer Video",category:"AI Videos & CGI",video:"https://youtu.be/htxbWcPvIn4",poster:"",description:"AI explainer video for NRL. Brand logo thumbnail to be added."},...[{title:"Emper — Video Highlights",category:"Video Highlights",video:"https://youtu.be/_dcuEn4TNiM"},{title:"Alpha Arts — Video Highlights",category:"Video Highlights",video:"https://youtu.be/Pr6DJHmH-zw"},{title:"I-Remedies — Video Highlights",category:"Video Highlights",video:"https://youtu.be/qHdpoM1qa58"},{title:"Kenz de Rasasi — Video Highlights",category:"Video Highlights",video:"https://youtu.be/CykQ7cmosV8"},{title:"Al Masaood — Video Highlights",category:"Video Highlights",video:"https://youtu.be/FvZH7Wg7Y-U"}],...["Caneza","Maison Mirwad","Korbaj Parfums","Cevera","Bellarosa"].map(title=>({title,category:"Exhibition Coverage"})),{title:"L'Chear Cosmetics",category:"Content Production"},{title:"Tubbees",category:"Brand Activations"},{title:"SAPIL",category:"Brand Activations"}];
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const categories=[...new Set(projects.map(p=>p.category))];
const catalog = document.getElementById("catalog");
catalog.innerHTML = categories.map(cat => {
  const cards = projects.map((p,i)=>({...p,i})).filter(p=>p.category===cat).map(p => {
    const videoId = p.video ? p.video.split("/").pop() : "";
    const thumbnail = p.poster || (videoId ? "https://i.ytimg.com/vi/" + videoId + "/hqdefault.jpg" : "");
    const poster = thumbnail ? '<img src="' + esc(thumbnail) + '" alt="' + esc(p.title) + '">' : '<span class="pending">AS PRIME / SELECTED WORK</span>';
    return '<article class="tile" tabindex="0" role="button" data-index="' + p.i + '"><div class="poster">' + poster + (p.video ? '<span class="play">▶</span>' : '') + '</div><h4>' + esc(p.title) + '</h4><small>' + (p.video ? 'WATCH PROJECT' : 'VIDEO COMING SOON') + '</small></article>';
  }).join("");
  return '<section class="section"><h3>' + esc(cat) + '</h3><div class="rail">' + cards + '</div></section>';
}).join("");
function openProject(i){let p=projects[i];document.getElementById("title").textContent=p.title;document.getElementById("details").textContent=p.description||p.category;const id=(p.video||"").match(/(?:youtu\.be\/|[?&]v=)([\w-]{11})/);document.getElementById("player").innerHTML=id?'<iframe title="Project video" src="https://www.youtube-nocookie.com/embed/'+id[1]+'?autoplay=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>':'<p style="padding:40px">Video coming soon</p>';document.getElementById("modal").showModal()}
function closePlayer(){document.getElementById("modal").close();document.getElementById("player").innerHTML=""}document.getElementById("modal").addEventListener("close",()=>document.getElementById("player").innerHTML="");document.querySelectorAll(".tile").forEach(el=>{el.onclick=()=>openProject(+el.dataset.index);el.onkeydown=e=>{if(e.key==="Enter")openProject(+el.dataset.index)}})
</script></body></html>
